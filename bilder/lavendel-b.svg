<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img"
     aria-label="Schematische Zeichnung: Lavandin mit verzweigten Blütenstielen, je drei Ähren pro Stiel">
  <defs>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EEDF"/>
      <stop offset="1" stop-color="#EADFC8"/>
    </linearGradient>
    <linearGradient id="blossomB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E79C9"/>
      <stop offset="1" stop-color="#6A57A4"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#skyB)"/>

  <!-- zwei kräftige Stiele, die sich oben dreifach verzweigen:
       das Erkennungsmerkmal von Lavandula x intermedia (Lavandin) -->
  <g stroke="#6E8B4A" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M140 288 C138 232 141 200 142 178"/>
    <path d="M142 178 C120 166 106 154 98 140"/>
    <path d="M142 178 C164 166 178 154 186 140"/>
    <path d="M142 178 C142 166 142 154 142 142"/>

    <path d="M266 290 C264 238 267 208 268 188"/>
    <path d="M268 188 C248 176 236 166 229 153"/>
    <path d="M268 188 C288 176 300 166 307 153"/>
    <path d="M268 188 C268 176 268 164 268 152"/>
  </g>

  <!-- Blätter -->
  <g fill="#7E9A5C">
    <ellipse cx="124" cy="256" rx="19" ry="5" transform="rotate(-21 124 256)"/>
    <ellipse cx="157" cy="266" rx="18" ry="5" transform="rotate(21 157 266)"/>
    <ellipse cx="250" cy="260" rx="19" ry="5" transform="rotate(-20 250 260)"/>
    <ellipse cx="283" cy="270" rx="18" ry="5" transform="rotate(20 283 270)"/>
  </g>

  <!-- je drei schlankere, lockerere Ähren -->
  <g fill="url(#blossomB)">
    <ellipse cx="96"  cy="116" rx="8.5" ry="26" transform="rotate(-14 96 116)"/>
    <ellipse cx="142" cy="112" rx="9"   ry="30"/>
    <ellipse cx="188" cy="116" rx="8.5" ry="26" transform="rotate(14 188 116)"/>

    <ellipse cx="227" cy="129" rx="8.5" ry="25" transform="rotate(-14 227 129)"/>
    <ellipse cx="268" cy="123" rx="9"   ry="29"/>
    <ellipse cx="309" cy="129" rx="8.5" ry="25" transform="rotate(14 309 129)"/>
  </g>
  <g fill="#A891DA" opacity=".85">
    <ellipse cx="94"  cy="106" rx="5" ry="4"/><ellipse cx="99"  cy="124" rx="5" ry="4"/>
    <ellipse cx="139" cy="100" rx="5" ry="4"/><ellipse cx="145" cy="120" rx="5" ry="4"/>
    <ellipse cx="186" cy="106" rx="5" ry="4"/><ellipse cx="191" cy="124" rx="5" ry="4"/>
    <ellipse cx="225" cy="119" rx="5" ry="4"/><ellipse cx="230" cy="137" rx="5" ry="4"/>
    <ellipse cx="265" cy="111" rx="5" ry="4"/><ellipse cx="271" cy="131" rx="5" ry="4"/>
    <ellipse cx="307" cy="119" rx="5" ry="4"/><ellipse cx="312" cy="137" rx="5" ry="4"/>
  </g>

  <text x="200" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#8B98A1">
    Schematische Zeichnung
  </text>
</svg>
